<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="屏幕切换 图标">
  <title>屏幕切换 · Screen Switch</title>
  <desc>深蓝渐变方砖 + 显示器轮廓 + 双向箭头，表示在 Windows 与 Mac 之间切换显示器输入源。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D6BF5"/>
      <stop offset="1" stop-color="#1734A0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="1.05" r="0.8">
      <stop offset="0" stop-color="#0DB0A4" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#0DB0A4" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0DB0A4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="113.7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
  </g>

  <!-- 屏幕 -->
  <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <rect x="113" y="142" width="286" height="176" rx="16"/>
    <path d="M176 230H338"/>
    <path d="M176 202 146 230 176 258"/>
    <path d="M338 202 368 230 338 258"/>
  </g>

  <!-- 支架 -->
  <g fill="#fff">
    <rect x="240" y="318" width="32" height="24" rx="3"/>
    <rect x="202" y="340" width="108" height="18" rx="7"/>
  </g>
</svg>
